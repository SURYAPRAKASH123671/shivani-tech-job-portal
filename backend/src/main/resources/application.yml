server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  main:
    banner-mode: off
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shivani_job_portal?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Positive value (HikariCP default) = fail fast: if no connection can be obtained
      # within connection-timeout, startup throws immediately with the real underlying
      # exception (auth failure, unknown host, SSL handshake, etc.) instead of letting it
      # surface later as Hibernate's opaque "Unable to determine Dialect" error.
      # (initialization-fail-timeout: 0 means the OPPOSITE - it lets the pool start even
      # if the first connection attempt fails - so it must stay positive here.)
      initialization-fail-timeout: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # Pinned explicitly rather than left to Hibernate 6's JDBC-metadata autodetection,
        # which TiDB's non-standard version-reporting can confuse into the same
        # "Unable to determine Dialect" error even when the connection itself is fine.
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  # Restricts the class-scanning springdoc does at startup to build the OpenAPI model to just
  # our own controllers, instead of the whole classpath - meaningfully cuts reflection-bound
  # startup work on a CPU-throttled host.
  packages-to-scan: com.shivanitech.jobportal.controller

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail is intentionally optional in this app (falls back to logging when unconfigured -
    # see EmailService) - it shouldn't drag the whole app's health status to DOWN.
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-before-deploying-anywhere}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:no-reply@shivanitech.in}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  uploads-dir: ${UPLOADS_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.shivanitech.jobportal: ${APP_LOG_LEVEL:INFO}
